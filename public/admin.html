<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockWise Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { --bg:#f4f6fb; --card:#fff; --ink:#14213d; --muted:#6b7280; --accent:#1d4ed8; --accent-soft:#dbeafe; --danger:#b91c1c; --danger-soft:#fee2e2; --border:#e5e7eb; --shadow:0 12px 28px rgba(20,33,61,.08);}
      * { box-sizing:border-box; }
      body { margin:0; font-family:"Outfit",sans-serif; background:radial-gradient(circle at top, #eef2ff, var(--bg) 42%); color:var(--ink); }
      .container { max-width:1120px; margin:2rem auto; padding:0 1rem 2rem; }
      .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; margin-bottom:1rem; }
      .hero h1 { margin:0; font-family:"Playfair Display",serif; font-size:clamp(1.8rem,4vw,2.5rem); }
      .hero p { margin:.35rem 0 0; color:var(--muted); }
      .panel { background:var(--card); border:1px solid var(--border); border-radius:1rem; box-shadow:var(--shadow); padding:1rem; margin-bottom:1rem; }
      .panel-title { margin:0 0 .9rem; font-size:1rem; }
      #message { min-height:2rem; margin:.5rem 0 1rem; padding:.55rem .8rem; border-radius:.6rem; background:#ecfdf5; color:#047857; transition:opacity 140ms ease; }
      #message.hidden { opacity:0; }
      .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.65rem; }
      label { display:grid; gap:.35rem; font-size:.82rem; color:var(--muted); }
      input, select { width:100%; border:1px solid var(--border); border-radius:.65rem; padding:.58rem .66rem; font:inherit; }
      input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
      .actions,.toolbar { display:flex; gap:.55rem; margin-top:.85rem; flex-wrap:wrap; align-items:center; }
      button { border:0; border-radius:.65rem; padding:.58rem .86rem; font:inherit; font-weight:600; cursor:pointer; }
      .btn-primary { background:var(--accent); color:#fff; }
      .btn-secondary { background:#eef2ff; color:var(--ink); }
      .btn-danger { background:var(--danger-soft); color:var(--danger); }
      .btn-small { font-size:.8rem; padding:.4rem .6rem; }
      .table-wrap { overflow:auto; }
      table { width:100%; border-collapse:collapse; min-width:760px; }
      th, td { border-bottom:1px solid var(--border); text-align:left; padding:.7rem .55rem; }
      th { color:var(--muted); font-size:.82rem; font-weight:600; }
      .muted { color:var(--muted); }
      .low-stock { color:var(--danger); font-weight:700; }
      .empty { text-align:center; padding:1.2rem; color:var(--muted); }
      @media (max-width:860px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
      @media (max-width:640px) { .hero { flex-direction:column; align-items:flex-start; } .grid { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div>
          <h1>StockWise Admin</h1>
          <p>Manage products and adjust stock quantities.</p>
        </div>
        <a class="btn-secondary" style="text-decoration:none" href="/">Back to Stock Page</a>
      </header>

      <p id="message" class="hidden"></p>

      <section class="panel">
        <h2 class="panel-title">Add / Edit Product</h2>
        <form id="productForm">
          <div class="grid">
            <label>Name<input id="name" required /></label>
            <label>SKU<input id="sku" required /></label>
            <label>Category<input id="category" required /></label>
            <label>Quantity<input id="quantity" type="number" min="0" required /></label>
            <label>Min Stock<input id="minStock" type="number" min="0" required /></label>
            <label>Price<input id="price" type="number" step="0.01" min="0" required /></label>
            <label style="grid-column: span 2">Location<input id="location" /></label>
          </div>
          <div class="actions">
            <button id="saveBtn" class="btn-primary" type="submit">Save Product</button>
            <button id="cancelEditBtn" class="btn-secondary" type="button">Cancel Edit</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2 class="panel-title">Quick Stock Adjustment</h2>
        <div class="grid">
          <label style="grid-column: span 2">Product
            <select id="adjustProductId"></select>
          </label>
          <label>Action
            <select id="adjustAction">
              <option value="OUT">Decrease (OUT)</option>
              <option value="IN">Increase (IN)</option>
            </select>
          </label>
          <label>Amount<input id="adjustAmount" type="number" min="1" value="1" /></label>
        </div>
        <div class="actions">
          <button id="applyAdjustBtn" class="btn-primary" type="button">Apply Adjustment</button>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Products</h2>
        <div class="toolbar">
          <input id="search" placeholder="Search name or SKU" />
          <input id="categoryFilter" placeholder="Filter category" />
          <label class="muted"><input id="lowStockOnly" type="checkbox" /> Low stock only</label>
          <button id="filterBtn" class="btn-secondary" type="button">Apply</button>
          <button id="clearFiltersBtn" class="btn-secondary" type="button">Clear</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th><th>SKU</th><th>Category</th><th>Qty</th><th>Min</th><th>Price</th><th>Location</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="productRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="./admin.js"></script>
  </body>
</html>
