<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockWise Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #ffffff;
        --ink: #14213d;
        --muted: #6b7280;
        --accent: #1d4ed8;
        --accent-soft: #dbeafe;
        --danger: #b91c1c;
        --danger-soft: #fee2e2;
        --border: #e5e7eb;
        --shadow: 0 12px 28px rgba(20, 33, 61, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Outfit", sans-serif;
        background: radial-gradient(circle at top, #eef2ff, var(--bg) 42%);
        color: var(--ink);
      }

      .container {
        max-width: 1120px;
        margin: 2rem auto;
        padding: 0 1rem 2rem;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .hero h1 {
        margin: 0;
        font-family: "Playfair Display", serif;
        letter-spacing: 0.4px;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }

      .hero p {
        margin: 0.35rem 0 0;
        color: var(--muted);
      }

      #message {
        min-height: 2rem;
        margin: 0.5rem 0 1rem;
        padding: 0.55rem 0.8rem;
        border-radius: 0.6rem;
        background: #ecfdf5;
        color: #047857;
        transition: opacity 140ms ease;
      }

      #message.hidden {
        opacity: 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.8rem;
        margin-bottom: 1rem;
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 0.9rem;
        padding: 0.8rem 0.9rem;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .stat-value {
        margin-top: 0.3rem;
        font-size: 1.4rem;
        font-weight: 700;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 1rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .panel-title {
        margin: 0 0 0.9rem;
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.65rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.82rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 0.65rem;
        padding: 0.58rem 0.66rem;
        font: inherit;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .actions {
        display: flex;
        gap: 0.55rem;
        margin-top: 0.85rem;
      }

      button {
        border: 0;
        border-radius: 0.65rem;
        padding: 0.58rem 0.86rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-secondary {
        background: #eef2ff;
        color: var(--ink);
      }

      .btn-danger {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .btn-small {
        font-size: 0.8rem;
        padding: 0.4rem 0.6rem;
      }

      .toolbar {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .toolbar input {
        width: 200px;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--muted);
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }

      th, td {
        border-bottom: 1px solid var(--border);
        text-align: left;
        padding: 0.7rem 0.55rem;
      }

      th {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .low-stock {
        color: var(--danger);
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      .empty {
        text-align: center;
        padding: 1.2rem;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .container {
          margin-top: 1rem;
        }

        .hero {
          flex-direction: column;
          align-items: flex-start;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div>
          <h1>StockWise</h1>
          <p>Smarter inventory tracking for your shop or home.</p>
        </div>
      </header>

      <p id="message" class="hidden"></p>

      <section class="stats">
        <article class="stat">
          <div class="stat-label">Total Products</div>
          <div id="statProducts" class="stat-value">0</div>
        </article>
        <article class="stat">
          <div class="stat-label">Total Units</div>
          <div id="statUnits" class="stat-value">0</div>
        </article>
        <article class="stat">
          <div class="stat-label">Low Stock Items</div>
          <div id="statLowStock" class="stat-value">0</div>
        </article>
        <article class="stat">
          <div class="stat-label">Inventory Value</div>
          <div id="statValue" class="stat-value">$0.00</div>
        </article>
      </section>

      <section class="panel">
        <h2 class="panel-title">Add / Edit Product</h2>
        <form id="productForm">
          <div class="grid">
            <label>Name<input id="name" placeholder="Rice bag" required /></label>
            <label>SKU<input id="sku" placeholder="SKU-1001" required /></label>
            <label>Category<input id="category" placeholder="Food" required /></label>
            <label>Quantity<input id="quantity" type="number" min="0" placeholder="10" required /></label>
            <label>Min Stock<input id="minStock" type="number" min="0" placeholder="3" required /></label>
            <label>Price<input id="price" type="number" step="0.01" min="0" placeholder="12.50" required /></label>
            <label style="grid-column: span 2">Location<input id="location" placeholder="Shelf A / Kitchen" /></label>
          </div>
          <div class="actions">
            <button id="saveBtn" class="btn-primary" type="submit">Save Product</button>
            <button id="cancelEditBtn" class="btn-secondary" type="button">Cancel Edit</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2 class="panel-title">Inventory List</h2>
        <div class="toolbar">
          <input id="search" placeholder="Search name or SKU" />
          <input id="categoryFilter" placeholder="Filter by category" />
          <label class="checkbox"><input id="lowStockOnly" type="checkbox" /> Low stock only</label>
          <button id="filterBtn" class="btn-secondary" type="button">Apply</button>
          <button id="clearFiltersBtn" class="btn-secondary" type="button">Clear</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>SKU</th>
                <th>Category</th>
                <th>Qty</th>
                <th>Min</th>
                <th>Price</th>
                <th>Location</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
